  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ve; opacity:.9;\">\n            <div style=\"position:absolute; inset:1.5px; width:62%; background:#E0A434; border-radius:1px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ============ HEADER (chrome) ============ -->\n      <sc-if value=\"{{ showChrome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:none; padding:4px 18px 12px; display:flex; align-items:center; justify-content:space-between; z-index:20; position:relative;\">\n          <div onclick=\"{{ goLand }}\" style=\"display:flex; align-items:center; gap:9px; cursor:pointer;\">\n            <div style=\"background:#fff; border-radius:7px; padding:5px 8px; display:flex; box-shadow:0 2px 6px rgba(0,0,0,.3);\"><img src=\"6741b608-af0c-4b24-8017-e5a74af4a1ea\" alt=\"etc.\" style=\"height:15px; display:block;\"><\u002Fdiv>\n            <span style=\"font-family:'Bungee',cursive; font-size:8.5px; line-height:1.3; letter-spacing:.16em; color:rgba(244,233,212,.6);\">SECRET<br>MISSION<\u002Fspan>\n          <\u002Fdiv>\n          <div onclick=\"{{ goPrize }}\" style=\"display:flex; align-items:center; gap:8px; background:rgba(244,233,212,.08); border:1px solid rgba(244,233,212,.16); padding:6px 11px; border-radius:30px; cursor:pointer;\">\n            <div style=\"display:flex; gap:3px;\">\n              <sc-for list=\"{{ stamps }}\" as=\"st\" hint-placeholder-count=\"5\">\n                <div style=\"width:9px; height:9px; border-radius:50%; background: {{ st.color }}; box-shadow:0 0 0 1.5px rgba(0,0,0,.25) inset;\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-family:'Bungee',cursive; font-size:11px; color:#F4E9D4;\">{{ countLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SCROLL CONTENT ============ -->\n      <div class=\"scr\" style=\"flex:1; overflow-y:auto; overflow-x:hidden; position:relative; z-index:10;\">\n\n        <!-- ===================== LANDING ===================== -->\n        <sc-if value=\"{{ showLand }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"min-height:752px; display:flex; flex-direction:column; padding:8px 26px 30px; position:relative; text-align:center;\">\n            <div style=\"position:absolute; top:-380px; left:calc(50% - 600px); width:1200px; height:1200px; background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(217,102,58,.5) 0deg 8deg, transparent 8deg 16deg); opacity:.5; pointer-events:none; animation:spin360 90s linear infinite;\"><\u002Fdiv>\n            <div style=\"position:absolute; top:78px; left:calc(50% - 60px); width:120px; height:120px; animation:floaty 5s ease-in-out infinite; z-index:2;\">\n              <!-- hanging string -->\n              <div style=\"position:absolute; left:50%; top:-26px; width:2px; height:26px; background:linear-gradient(rgba(244,233,212,.65), rgba(244,233,212,0)); transform:translateX(-50%);\"><\u002Fdiv>\n              <!-- ball body -->\n              <div style=\"position:absolute; inset:0; border-radius:50%; overflow:hidden; box-shadow:0 0 48px rgba(224,164,52,.42), 0 12px 26px rgba(0,0,0,.5); background-color:#aab4c6; background-image:radial-gradient(circle at 30% 24%, #ffffff, rgba(255,255,255,0) 34%), repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 0.8px, transparent 0.8px 13px), repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0 0.8px, transparent 0.8px 13px), radial-gradient(circle at 30% 24%, #ffffff 0%, #d2dbe9 24%, #93a0b6 55%, #545f74 82%, #2c3445 100%); background-size:100% 100%, 13px 13px, 13px 13px, 100% 100%;\">\n                <!-- colored disco light sweeping the mirrors -->\n                <div style=\"position:absolute; inset:-25%; background:conic-gradient(from 0deg, rgba(200,68,126,.6), rgba(224,164,52,.55), rgba(46,139,139,.6), rgba(217,102,58,.55), rgba(200,68,126,.6)); mix-blend-mode:overlay; opacity:.85; animation:spin360 7s linear infinite;\"><\u002Fdiv>\n Fstrong> this week, some online, some at our booth. Every one of them is about driving the right activity and the right engagement, the kind that actually moves a practice forward. <strong style=\"color:#F4E9D4;\">Complete them all and you're IN<\u002Fstrong> the draws.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"flex:1;\"><\u002Fdiv>\n\n            <div style=\"position:relative; z-index:3; margin-top:26px;\">\n              <div style=\"font-family:'Monoton',cursive; font-size:30px; color:#F4E9D4; text-shadow:0 0 24px rgba(200,68,126,.45); margin-bottom:14px; letter-spacing:.02em;\">Let's Get Digital!<\u002Fdiv>\n              <div onclick=\"{{ goHub }}\" style=\"background:#E0A434; color:#1A1206; font-family:'Bungee',cursive; font-size:17px; padding:18px; border-radius:18px; cursor:pointer; box-shadow:0 8px 0 #a9781f, 0 16px 24px -8px rgba(224,164,52,.5); letter-spacing:.02em;\">{{ acceptLabel }}<\u002Fdiv>\n              <div style=\"margin-top:18px; display:flex; align-items:center; justify-content:center; gap:8px;\">\n                <span style=\"font-size:11px; letter-spacing:.1em; color:rgba(244,233,212,.5);\">See you daily at the<\u002Fspan>\n                <div style=\"background:#fff; border-radius:7px; padding:4px 7px; display:flex;\"><img src=\"6741b608-af0c-4b24-8017-e5a74af4a1ea\" alt=\"etc.\" style=\"height:14px; display:block;\"><\u002Fdiv>\n                <span style=\"font-size:11px; letter-spacing:.1em; color:rgba(244,233,212,.5);\">booth<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ===================== HUB ===================== -->\n        <sc-if value=\"{{ showHub }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:8px 18px 28px;\">\n            <div style=\"font-size:11px; letter-spacing:.18em; color:rgba(244,233,212,.5);\">WELCOME BACK, AGENT<\u002Fdiv>\n            <h2 style=\"font-family:'Bungee',cursive; color:#F4E9D4; font-size:25px; line-height:1.04; margin:8px 0 0;\">5 missions.<br><span style=\"color:#E0A434;\">1 objective.<\u002Fspan><\u002Fh2>\n\n            <!-- progress stamps -->\n            <div style=\"margin-top:18px; background:linear-gradient(150deg,#152348,#101b35); border:1px solid rgba(244,233,212,.12); border-radius:20px; padding:16px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:13px;\">\n                <span style=\"font-size:11px; letter-spacing:.16em; color:rgba(244,233,212,.6);\">MISSION LOG<\u002Fspan>\n                <span style=\"font-family:'Bungee',cursive; font-size:13px; color:#E0A434;\">{{ countLabel }} DONE<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:8px;\">\n                <sc-for list=\"{{ stamps }}\" as=\"st\" hint-placeholder-count=\"5\">\n                  <div style=\"flex:1; aspect-ratio:1; border-radius:13px; display:flex; align-items:center; justify-content:center; background: {{ st.bg }}; border:1.5px dashed {{ st.border }}; position:relative;\">\n                    <span style=\"font-family:'Bungee',cursive; font-size:23px; color: {{ st.fg }};\">{{ st.glyph }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- featured -->\n            <div style=\"margin-top:18px;\">\n              <div style=\"font-size:11px; letter-spacing:.18em; color:rgba(244,233,212,.5); margin-bottom:9px;\">{{ featuredKicker }}<\u002Fdiv>\n              <div onclick=\"{{ featuredAction }}\" style=\"position:relative; overflow:hidden; border-radius:22px; padding:22px; cursor:pointer; background: {{ featuredBg }}; box-shadow:0 18px 30px -16px rgba(0,0,0,.6);\">\n                <div style=\"position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%; background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(0,0,0,.12) 0deg 10deg, transparent 10deg 20deg);\"><\u002Fdiv>\n                <div style=\"position:relative;\">\n                  <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:14px;\">\n                    <span style=\"font-family:'Bungee',cursive; font-size:11px; background:rgba(0,0,0,.22); color:#fff; padding:4px 10px; border-radius:20px;\">{{ featuredDay }}<\u002Fspan>\n                    <span style=\"font-size:10px; letter-spacing:.14em; color:rgba(0,0,0,.55); font-weight:600;\">{{ featuredKind }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11px; letter-spacing:.1em; color:rgba(0,0,0,.55); font-weight:600;\">OPERATION<\u002Fdiv>\n                  <h3 style=\"font-family:'Bungee',cursive; font-size:23px; color:#1A1206; margin:3px 0 8px; line-height:1.05;\">{{ featuredTitle }}<\u002Fh3>\n                  <p style=\"font-size:14px; color:rgba(26,18,6,.78); margin:0 0 16px; line-height:1.45;\">{{ featuredTagline }}<\u002Fp>\n                  <div style=\"display:inline-flex; align-items:center; gap:8px; background:#1A1206; color:#F4E9D4; font-family:'Bungee',cursive; font-size:13px; padding:11px 16px; border-radius:13px;\">{{ featuredCta }} →<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- all missions list -->\n            <div style=\"font-size:11px; letter-spacing:.18em; color:rgba(244,233,212,.5); margin:24px 0 11px;\">ALL MISSIONS<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <sc-for list=\"{{ missions }}\" as=\"m\" hint-placeholder-count=\"5\">\n                <div onclick=\"{{ m.open }}\" style=\"display:flex; align-items:center; gap:13px; background:rgba(244,233,212,.05); border:1px solid rgba(244,233,212,.1); border-left:5px solid {{ m.accent }}; border-radius:15px; padding:13px 14px; cursor:pointer;\">\n                  <div style=\"flex:none; width:38px; height:38px; border-radius:11px; background: {{ m.accent }}; display:flex; align-items:center; justify-content:center; font-family:'Bungee',cursive; font-size:16px; color:#1A1206;\">{{ m.n }}<\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"display:flex; align-items:center; gap:7px;\">\n                      <span style=\"font-family:'Bungee',cursive; font-size:9.5px; color:rgba(244,233,212,.55);\">{{ m.day }}<\u002Fspan>\n                      <span style=\"font-size:8.5px; letter-spacing:.1em; color:rgba(244,233,212,.4); font-weight:600;\">{{ m.kind }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#F4E9D4; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ m.title }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:none; font-family:'Bungee',cursive; font-size:11px; padding:6px 11px; border-radius:20px; background: {{ m.pillBg }}; color: {{ m.pillFg }};\">{{ m.statusLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- commercial -->\n            <div style=\"margin-top:22px; border-radius:18px; padding:18px; background:linear-gradient(110deg,#122046,#0E1730); border:1px dashed rgba(46,139,139,.5); position:relative; overflow:hidden;\">\n              <div style=\"font-family:'Bungee',cursive; font-size:9px; letter-spacing:.14em; color:#2E8B8B; margin-bottom:8px;\">📺 NOW SHOWING<\u002Fdiv>\n              <div style=\"font-family:'Bungee',cursive; font-size:16px; color:#F4E9D4; line-height:1.1;\">Living My Plan™<\u002Fdiv>\n              <p style=\"font-size:13px; color:rgba(244,233,212,.72); margin:8px 0 14px; line-height:1.45;\">Collaborative client service plans that keep advisory teams and clients engaged all year, not just at review time.<\u002Fp>\n              <div onclick=\"{{ goSuite }}\" style=\"display:inline-block; font-size:12px; font-weight:700; color:#2E8B8B; cursor:pointer; border-bottom:1.5px solid #2E8B8B;\">See apps. by Etc. →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ===================== MISSION DETAIL ===================== -->\n        <sc-if value=\"{{ showMission }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:6px 18px 30px;\">\n            <div onclick=\"{{ goHub }}\" style=\"display:inline-flex; align-items:center; gap:6px; color:rgba(244,233,212,.6); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:14px;\">← All missions<\u002Fdiv>\n\n            <div style=\"background:#F4E9D4; border-radius:22px; overflow:hidden; box-shadow:0 24px 40px -18px rgba(0,0,0,.6); position:relative;\">\n              <!-- folder tab -->\n              <div style=\"height:54px; background: {{ active.accent }}; display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:relative;\">\n                <span style=\"font-family:'Bungee',cursive; font-size:12px; color:#1A1206;\">{{ active.day }} · {{ active.kind }}<\u002Fspan>\n                <span style=\"font-family:'Bungee',cursive; font-size:13px; color:rgba(26,18,6,.5);\">{{ active.tag }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:22px 20px 24px;\">\n                <div style=\"font-size:11px; letter-spacing:.14em; color:rgba(26,18,6,.5); font-weight:700;\">OPERATION<\u002Fdiv>\n                <h2 style=\"font-family:'Bungee',cursive; font-size:27px; color:#1A1206; margin:4px 0 0; line-height:1.02;\">{{ active.codename }}<\u002Fh2>\n                <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color: {{ active.accentDark }}; margin-top:6px;\">{{ active.title }}<\u002Fdiv>\n\n                <div style=\"height:1px; background:rgba(26,18,6,.12); margin:18px 0;\"><\u002Fdiv>\n\n                <div style=\"font-size:10px; letter-spacing:.16em; color:rgba(26,18,6,.45); font-weight:700; margin-bottom:7px;\">THE BRIEF<\u002Fdiv>\n                <div style=\"font-size:14.5px; line-height:1.55; color:rgba(26,18,6,.85);\">\n                  <sc-for list=\"{{ active.briefLines }}\" as=\"bl\" hint-placeholder-count=\"3\">\n                    <p style=\"margin:0 0 6px;\"><strong style=\"color:#1A1206;\">{{ bl.b }}<\u002Fstrong>{{ bl.t }}<strong style=\"color:#1A1206;\">{{ bl.b2 }}<\u002Fstrong>{{ bl.t2 }}<\u002Fp>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ active.codeword }}\" hint-placeholder-val=\"\">\n                  <div style=\"margin-top:16px; background:rgba(200,68,126,.1); border:1px dashed rgba(200,68,126,.6); border-radius:13px; padding:13px 15px;\">\n                    <div style=\"font-size:10px; letter-spacing:.14em; color:#a52f63; font-weight:700;\">🤫 TODAY'S CODE WORD<\u002Fdiv>\n                    <div style=\"font-family:'Bungee',cursive; font-size:19px; color:#C8447E; margin-top:4px;\">{{ active.codeword }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:rgba(26,18,6,.6); margin-top:4px;\">Work it into the conversation. Naturally. Good luck.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"font-size:10px; letter-spacing:.16em; color:rgba(26,18,6,.45); font-weight:700; margin:18px 0 9px;\">YOUR ORDERS<\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:9px;\">\n                  <sc-for list=\"{{ active.steps }}\" as=\"step\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; align-items:flex-start; gap:11px;\">\n                      <div style=\"flex:none; width:22px; height:22px; border-radius:50%; background: {{ active.accent }}; color:#1A1206; font-family:'Bungee',cursive; font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:1px;\">{{ step.n }}<\u002Fdiv>\n                      <div style=\"font-size:14px; line-height:1.4; color:rgba(26,18,6,.85);\">{{ step.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:18px; background:rgba(26,18,6,.05); border-radius:13px; padding:13px 15px;\">\n                  <span style=\"font-size:10px; letter-spacing:.14em; color:rgba(26,18,6,.45); font-weight:700;\">REWARD<\u002Fspan>\n                  <div style=\"font-size:14px; font-weight:700; color:#1A1206; margin-top:3px;\">{{ active.reward }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- actions -->\n            <sc-if value=\"{{ active.isSurvey }}\" hint-placeholder-val=\"{{ true }}\">\n              <div onclick=\"{{ goSurvey }}\" style=\"margin-top:16px; background:#D9663A; color:#fff; font-family:'Bungee',cursive; font-size:16px; padding:17px; border-radius:16px; text-align:center; cursor:pointer; box-shadow:0 7px 0 #a84a26;\">START THE SURVEY →<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ active.showManual }}\" hint-placeholder-val=\"{{ true }}\">\n              <div onclick=\"{{ active.toggle }}\" style=\"margin-top:16px; background: {{ active.btnBg }}; color: {{ active.btnFg }}; font-family:'Bungee',cursive; font-size:15px; padding:17px; border-radius:16px; text-align:center; cursor:pointer; border:2px solid {{ active.btnBd }};\">{{ active.btnLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"text-align:center; font-size:11px; color:rgba(244,233,212,.4); margin-top:12px; line-height:1.4;\">{{ active.footnote }}<\u002Fdiv>\n            <div onclick=\"{{ goHub }}\" style=\"margin-top:16px; text-align:center; font-size:13px; color:rgba(244,233,212,.6); font-weight:600; cursor:pointer;\">← Back to missions<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ===================== SURVEY ===================== -->\n        <sc-if value=\"{{ showSurvey }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:6px 22px 30px;\">\n\n            <sc-if value=\"{{ sv.isQ }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <div onclick=\"{{ goHub }}\" style=\"font-size:13px; color:rgba(244,233,212,.55); font-weight:600; cursor:pointer;\">✕ Exit<\u002Fdiv>\n                <div style=\"margin-top:16px; height:6px; border-radius:6px; background:rgba(244,233,212,.12); overflow:hidden;\">\n                  <div style=\"height:100%; width: {{ sv.progress }}; background:linear-gradient(90deg,#D9663A,#E0A434); border-radius:6px; transition:width .35s ease;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:'Bungee',cursive; font-size:11px; color:#E0A434; margin-top:12px;\">QUESTION {{ sv.qIndex }} / {{ sv.qTotal }}<\u002Fdiv>\n                <h2 style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; color:#F4E9D4; line-height:1.2; margin:8px 0 0;\">{{ sv.q }}<\u002Fh2>\n                <div style=\"font-size:12px; color:rgba(244,233,212,.5); margin-top:7px;\">{{ sv.hint }}<\u002Fdiv>\n\n                <div style=\"display:flex; flex-direction:column; gap:11px; margin-top:22px;\">\n                  <sc-for list=\"{{ sv.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <div onclick=\"{{ o.pick }}\" style=\"display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:15px; cursor:pointer; background: {{ o.bg }}; color: {{ o.fg }}; border:2px solid {{ o.bd }};\">\n                      <div style=\"flex:none; width:22px; height:22px; border-radius:7px; border:2px solid {{ o.markBd }}; background: {{ o.markBg }}; color:#1A1206; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;\">{{ o.mark }}<\u002Fdiv>\n                      <span style=\"font-size:15px; font-weight:600;\"> :11px; letter-spacing:.14em; color:rgba(244,233,212,.55); font-weight:700;\">HOW TO QUALIFY<\u002Fdiv>\n              <div style=\"display:flex; align-items:baseline; gap:8px; margin-top:8px;\">\n                <span style=\"font-family:'Bungee',cursive; font-size:34px; color:#E0A434;\">{{ countLabel }}<\u002Fspan>\n                <span style=\"font-size:14px; color:rgba(244,233,212,.6);\">missions complete<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px; height:8px; border-radius:8px; background:rgba(244,233,212,.12); overflow:hidden;\">\n                <div style=\"height:100%; width: {{ qualPct }}; background:linear-gradient(90deg,#D9663A,#E0A434); border-radius:8px; transition:width .4s ease;\"><\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ qualified }}\" hint-placeholder-val=\"\">\n                <div style=\"margin-top:18px;\">\n                  <div style=\"font-family:'Bungee',cursive; font-size:14px; color:#7B8B3A;\">✓ YOU'RE IN. Claim your spot:<\u002Fdiv>\n                  <input oninput=\"{{ onName }}\" value=\"{{ name }}\" placeholder=\"HELLO, my name is...\" style=\"margin-top:12px; width:100%; padding:15px; border-radius:14px; border:2px solid rgba(224,164,52,.4); background:rgba(244,233,212,.06); color:#F4E9D4; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; outline:none;\">\n                  <div onclick=\"{{ claim }}\" style=\"margin-top:12px; text-align:center; background:#E0A434; color:#1A1206; font-family:'Bungee',cursive; font-size:15px; padding:16px; border-radius:14px; cursor:pointer; box-shadow:0 6px 0 #a9781f;\">{{ claimLabel }}<\u002Fdiv>\n                  <div style=\"margin-top:10px; font-size:12.5px; color:rgba(244,233,212,.62); line-height:1.45;\">Get your entry for the draw. Proof you qualified is seeing your name on the digital wall below.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notQualified }}\" hint-placeholder-val=\"\">\n                <div style=\"margin-top:16px; font-size:13.5px; color:rgba(244,233,212,.7); line-height:1.5;\">{{ remainLabel }} You don't have to do them in order, so knock them out as you go.<\u002Fdiv>\n                <div onclick=\"{{ goHub }}\" style=\"margin-top:14px; text-align:center; background:rgba(244,233,212,.1); color:#F4E9D4; font-family:'Bungee',cursive; font-size:14px; padding:15px; border-radius:14px; cursor:pointer;\">VIEW MY MISSIONS →<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <!-- accomplished wall -->\n            <div style=\"font-size:11px; letter-spacing:.18em; color:rgba(244,233,212,.5); margin:24px 0 4px;\">MISSION ACCOMPLISHED WALL<\u002Fdiv>\n            <div style=\"font-size:12px; color:rgba(244,233,212,.55); line-height:1.45; margin:0 0 11px;\">The digital wall. If your name is here, your entry is in the draw.<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:9px;\">\n              <sc-for list=\"{{ wall }}\" as=\"w\" hint-placeholder-count=\"6\">\n                <div style=\"background:#F4E9D4; border-radius:9px; padding:0; overflow:hidden; transform:rotate({{ w.tilt }}); box-shadow:0 4px 10px -4px rgba(0,0,0,.5); min-width:96px;\">\n                  <div style=\"background:#D9663A; color:#fff; font-size:7.5px; letter-spacing:.1em; font-weight:800; padding:3px 0; text-align:center;\">HELLO my name is<\u002Fdiv>\n                  <div style=\"padding:9px 10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:#1A1206; text-align:center;\">{{ w.name }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div onclick=\"{{ goHub }}\" style=\"margin-top:22px; text-align:center; font-size:13px; color:rgba(244,233,212,.6); font-weight:600; cursor:pointer;\">← Back to missions<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n\n      <!-- ============ BOTTOM NAV (chrome) ============ -->\n      <sc-if value=\"{{ showChrome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:none; display:flex; padding:9px 12px 16px; background:rgba(14,23,48,.92); border-top:1px solid rgba(244,233,212,.1); backdrop-filter:blur(8px); z-index:20; position:relative;\">\n          <div onclick=\"{{ goHub }}\" style=\"flex:1; text-align:center; cursor:pointer;\">\n            <div style=\"font-size:18px; opacity: {{ nav.hubOp }};\">🎯<\u002Fdiv>\n            <div style=\"font-family:'Bungee',cursive; font-size:8.5px; margin-top:3px; color: {{ nav.hubFg }};\">MISSIONS<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ goSurvey }}\" style=\"flex:1; text-align:center; cursor:pointer;\">\n            <div style=\"font-size:18px; opacity: {{ nav.survOp }};\">📋<\u002Fdiv>\n            <div style=\"font-family:'Bungee',cursive; font-size:8.5px; margin-top:3px; color: {{ nav.survFg }};\">SURVEY<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ goSuite }}\" style=\"flex:1; text-align:center; cursor:pointer;\">\n            <div style=\"font-size:18px; opacity: {{ nav.suiteOp }};\">📺<\u002Fdiv>\n            <div style=\"font-family:'Bungee',cursive; font-size:8.5px; margin-top:3px; color: {{ nav.suiteFg }};\">APPS<\u002Fdiv>\n          <\u002Fdiv>\n          <div onclick=\"{{ goPrize }}\" style=\"flex:1; text-align:center; cursor:pointer;\">\n            <div style=\"font-size:18px; opacity: {{ nav.prizeOp }};\">🏆<\u002Fdiv>\n            <div style=\"font-family:'Bungee',cursive; font-size:8.5px; margin-top:3px; color: {{ nav.prizeFg }};\">PRIZES<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:12px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:14px;\">\n    <span style=\"font-size:10px; letter-spacing:.2em; color:rgba(244,233,212,.3);\">ETC PROJECTS × ADVOCIS BANFF SCHOOL<\u002Fspan>\n    <span onclick=\"{{ resetDemo }}\" style=\"font-size:10px; letter-spacing:.12em; color:rgba(224,164,52,.7); border:1px solid rgba(224,164,52,.35); padding:4px 10px; border-radius:20px; cursor:pointer;\">↺ RESET DEMO<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;boothNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Event&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.MISSIONS = [\n      { id:'homerun', day:'MON', kind:'GAME DAY', tag:'#01', accent:'#E0A434', accentDark:'#9a6d12',\n        codename:'Homerun', title:\"Let's see you in your buff\",\n        tagline:'Game on.',\n        briefLines:[\n          { t:'You have arrived at Banff School and decided to join us in the field.' },\n          { b:\"It's Game Day.\" },\n          { b:'Players:', t:' stop by the Etc. Projects booth to collect your team buff.' },\n          { b:'Cheerleaders:', t:' stop by our booth to grab your pom poms and noisemakers.' },\n          { b:'Everyone else:', t:' stop by and say hi, we would love to meet you.' },\n          { b:'BUFFS ARE LIMITED.', t:' First come, first serve.' }\n        ],\n        steps:['Find the Etc. Projects booth','Players grab your buff · Cheerleaders grab pom poms & noisemakers','Not playing or cheering? Just stop by and say hi','Mark this mission complete and gear up for Pinpoint Day'],\n        reward:'Your team buff (or pom poms), and Mission 1 in the bag' },\n      { id:'pins', day:'TUE', kind:\"WHAT'S THE POINT DAY\", tag:'#02', accent:'#C8447E', accentDark:'#a52f63',\n        codename:'Read the Room', title:'Ask About the Pins',\n        tagline:'The whole game is listening.',\n        briefLines:[\n          { b:\"We'll get right to the point.\" },\n          { t:'The right engagement helps you pinpoint what actually matters, so today is all about reading the room. Our agents are wearing a scarf covered in very questionable pins. Ask one of us about them, then listen closely. The best intel goes to the people who read between the lines.' }\n        ],\n        steps:['Find an agent wearing the pin scarf','Ask them about a pin, then read the room','Catch the code word, then use it in a sentence'],\n        reward:'A gold star, and a wildcard pin if you crack the code',\n        codeword:'lugubrious' },\n      { id:'coffee', day:'WED', kind:'FULLY LOADED', tag:'#03', accent:'#7B8B3A', accentDark:'#566327',\n        codename:'Fully Loaded', title:'The Extra Shot',\n        tagline:'Do more with what you already have.',\n        briefLines:[\n          { b:'Make the most of what you already have.' },\n          { t:\"Your existing tech is probably \", b2:\"fully loaded\", t2:\" with features you have never used. Stop by the booth and we'll turn your plain old coffee into a feature-rich brew, making the most of what you already have.\" },\n          { t:'Then enjoy your jazzy java, and think about investing a little more time in the tech you already own.' }\n        ],\n        steps:['Come by the booth on Wednesday','Jazz up your cup','Tell us about a digital tool you wish you used more'],\n        reward:'A tasty treat, some words of wisdom and another mission complete' },\n      { id:'survey', day:'THU', kind:'CANDY DAY', tag:'#04', accent:'#D9663A', accentDark:'#a84a26',\n        codename:'Sweet Intel', title:'The 90-Second Survey',\n        tagline:'Trade intel for candy.',\n        brief:'It is Candy Day. How do advisory teams actually keep clients engaged all year? Take our quick survey (online, any time this week), then come collect your candy at the booth on Thursday. You will also get the inside line on Living My Plan.',\n        steps:['Tap \"Start the survey\" below','Answer five quick questions','Show your finish screen at the booth for candy'],\n        reward:'Candy + intel on Living My Plan™' },\n      { id:'story', day:'ALL WEEK', kind:'STORY WALL', tag:'#05', accent:'#2E8B8B', accentDark:'#1d5a5a',\n        codename:'Pass It On', title:'Our Story Wall',\n        tagline:'Leave something for the ones coming up.',\n        briefLines:[\n          { b:'Psst..' },\n          { t:'Two burning questions:' },\n          { b:'1. The best advice you ever got?' },\n          { b:'2. The advice you would give someone just starting out?' },\n          { t:'Add it to the wall. You are contributing to the future of the profession.' }\n        ],\n        steps:['Grab a sticky note at the booth','Answer the two questions','Stick it on Our Story Wall'],\n        reward:'A spot on Our Story Wall' }\n    ];\n    this.GLYPHS = { 'homerun':'★', 'pins':'★', 'survey':'★', 'coffee':'★', 'story':'★' };\n    this.SURVEY = [\n      { id:'plans', type:'single', q:'How many of your client relationships have a written, shared service plan?',\n        hint:'Be honest, nobody is watching.',\n        opts:['Honestly, none yet','A handful','About half','Most of them'] },\n      { id:'engage', type:'multi', q:'How do you keep clients engaged between annual reviews?',\n        hint:'Pick all that apply.',\n        opts:['Scheduled annual review','Ad-hoc emails & calls','A newsletter','My CRM nudges me','I... do not, really'] },\n      { id:'gap', type:'single', q:'Where is the biggest gap on your team right now?',\n        hint:'The thing slowing you down most.',\n        opts:['The right tools','Training the team','Time to do it all','Consistency, year over year'] },\n      { id:'team', type:'single', q:'How big is the team behind you?',\n        hint:'Everyone who touches the client experience.',\n        opts:['Just me','2 to 4','5 to 10','More than 10'] }\n    ];\n    this.WALL_SEED = ['Priya','Marcus','Dana','Wade','Colin','Jeff'];\n    this.state = { screen:'land', activeId:null, sStep:0, ans:{}, completed:{}, name:'', email:'', joined:false, claimed:false };\n    this.scrollRef = React.createRef();\n  }\n\n  resetScroll() {\n    var run = function() {\n      var els = document.querySelectorAll('.scr');\n      for (var i = 0; i < els.length; i++) {\n        if (els[i].scrollHeight - els[i].clientHeight > 20) els[i].scrollTop = 0;\n      }\n    };\n    requestAnimationFrame(function() { run(); requestAnimationFrame(run); });\n  }\n\n  componentDidMount() {\n    try {\n      var raw = localStorage.getItem('etc-banff-v1');\n      if (raw) { var d = JSON.parse(raw) || {}; this.setState(function(s){ return Object.assign({}, s, d); }); }\n    } catch(e) {}\n  }\n  persist() {\n    try {\n      var s = this.state;\n      localStorage.setItem('etc-banff-v1', JSON.stringify({\n        screen:s.screen, activeId:s.activeId, sStep:s.sStep, ans:s.ans,\n        completed:s.completed, name:s.name, email:s.email, joined:s.joined, claimed:s.claimed\n      }));\n    } catch(e) {}\n  }\n  set(patch) { this.setState(patch, this.persist.bind(this)); }\n  go(screen) { this.set({ screen:screen }); this.resetScroll(); }\n  openMission(id) { this.set({ screen:'mission', activeId:id }); this.resetScroll(); }\n  toggleDone(id) {\n    var c = Object.assign({}, this.state.completed);\n    if (c[id]) delete c[id]; else c[id] = true;\n    this.set({ completed:c });\n  }\n  pickSingle(qid, opt) { var a = Object.assign({}, this.state.ans); a[qid] = opt; this.set({ ans:a }); }\n  toggleMulti(qid, opt) {\n    var a = Object.assign({}, this.state.ans);\n    var arr = (a[qid] || []).slice();\n    var i = arr.indexOf(opt);\n    if (i >= 0) arr.splice(i,1); else arr.push(opt);\n    a[qid] = arr; this.set({ ans:a });\n  }\n  sNext() { this.set({ sStep: Math.min(this.SURVEY.length, this.state.sStep + 1) }); this.resetScroll(); }\n  sBack() {\n    if (this.state.sStep <= 0) { this.go('hub'); return; }\n    this.set({ sStep: this.state.sStep - 1 });\n    this.resetScroll();\n  }\n  finishSurvey() {\n    var c = Object.assign({}, this.state.completed); c['survey'] = true;\n    this.set({ completed:c, sStep:this.SURVEY.length + 1 });\n    this.resetScroll();\n  }\n  claim() { this.set({ claimed:true }); }\n  resetDemo() {\n    try { localStorage.removeItem('etc-banff-v1'); } catch(e) {}\n    this.setState({ screen:'land', activeId:null, sStep:0, ans:{}, completed:{}, name:'', email:'', joined:false, claimed:false });\n  }\n\n  renderVals() {\n    var self = this;\n    var s = this.state;\n    var booth = this.props.boothNumber || '12';\n    var completed = s.completed || {};\n    var doneCount = this.MISSIONS.filter(function(m){ return completed[m.id]; }).length;\n    var total = this.MISSIONS.length;\n    var qualified = doneCount === total;\n\n    // mission list\n    var missions = this.MISSIONS.map(function(m, i){\n      var done = !!completed[m.id];\n      return Object.assign({}, m, {\n        n: i + 1,\n        done: done,\n        statusLabel: done ? '✓' : 'GO',\n        pillBg: done ? 'rgba(123,139,58,.9)' : 'rgba(244,233,212,.1)',\n        pillFg: done ? '#0E1730' : 'rgba(244,233,212,.8)',\n        open: function(){ self.openMission(m.id); }\n      });\n    });\n\n    // header stamps (small dots)\n    var stamps = this.MISSIONS.map(function(m){\n      var done = !!completed[m.id];\n      return {\n        color: done ? m.accent : 'rgba(244,233,212,.18)',\n        bg: done ? m.accent : 'rgba(244,233,212,.04)',\n        border: done ? m.accent : 'rgba(244,233,212,.22)',\n        fg: done ? '#1A1206' : 'rgba(244,233,212,.25)',\n        glyph: done ? '★' : '·'\n      };\n    });\n\n    // featured\n    var nextM = missions.filter(function(m){ return !m.done; })[0];\n    var featured = {};\n    if (qualified) {\n      featured = {\n        kicker:'OBJECTIVE COMPLETE', bg:'linear-gradient(150deg,#E0A434,#D9663A)',\n        day:'ALL 5', kind:'CLAIM YOUR PRIZE', title:'Mission Accomplished',\n        tagline:'Every stamp collected. Time to claim your spot in the draw.',\n        cta:'CLAIM PRIZE', action: function(){ self.go('prize'); }\n      };\n    } else {\n      featured = {\n        kicker:'UP NEXT', bg:'linear-gradient(150deg,'+nextM.accent+','+nextM.accentDark+')',\n        day:nextM.day, kind:nextM.kind, title:nextM.codename,\n        tagline:nextM.tagline, cta:'VIEW BRIEFING',\n        action: function(){ self.openMission(nextM.id); }\n      };\n    }\n\n    // active mission detail\n    var am = this.MISSIONS.filter(function(m){ return m.id === s.activeId; })[0] || this.MISSIONS[0];\n    var amDone = !!completed[am.id];\n    var briefLines = (am.briefLines || [{ t: am.brief }]).map(function(l){\n      return { b: l.b || '', t: l.t || '', b2: l.b2 || '', t2: l.t2 || '', hasB: !!l.b };\n    });\n    var active = Object.assign({}, am, {\n      briefLines: briefLines,\n      steps: am.steps.map(function(t, i){ return { n:i+1, text:t }; }),\n      isSurvey: am.id === 'survey',\n      showManual: am.id !== 'survey',\n      toggle: function(){ self.toggleDone(am.id); },\n      btnLabel: amDone ? '✓ MISSION COMPLETE · UNDO?' : 'MARK MISSION COMPLETE',\n      btnBg: amDone ? 'rgba(123,139,58,.18)' : am.accent,\n      btnFg: amDone ? '#9fb04a' : '#1A1206',\n      btnBd: amDone ? 'rgba(123,139,58,.5)' : am.accent,\n      footnote: am.id === 'survey'\n        ? 'Finishing the survey marks this one complete automatically.'\n        : 'Tap once you have done it at the booth. Honor system, agent.'\n    });\n\n    // survey view\n    var Q = this.SURVEY;\n    var sStep = s.sStep || 0;\n    var sv = {};\n    if (sStep < Q.length) {\n      var q = Q[sStep];\n      var ansVal = s.ans[q.id];\n      var hasAns = q.type === 'multi' ? ((ansVal||[]).length > 0) : !!ansVal;\n      sv.isQ = true; sv.q = q.q; sv.hint = q.hint;\n      sv.qIndex = sStep + 1; sv.qTotal = Q.length;\n      sv.progress = Math.round(((sStep) / (Q.length)) * 100) + '%';\n      sv.nextLabel = 'NEXT →';\n      sv.nextBg = hasAns ? '#E0A434' : 'rgba(244,233,212,.1)';\n      sv.nextFg = hasAns ? '#1A1206' : 'rgba(244,233,212,.4)';\n      sv.opts = q.opts.map(function(o){\n        var selected = q.type === 'multi' ? ((s.ans[q.id]||[]).indexOf(o) >= 0) : (s.ans[q.id] === o);\n        return {\n          label:o, selected:selected,\n          bg: selected ? '#20180F' : 'rgba(244,233,212,.05)',\n          fg: selected ? '#F4E9D4' : 'rgba(244,233,212,.92)',\n          bd: selected ? '#E0A434' : 'rgba(244,233,212,.14)',\n          markBg: selected ? '#E0A434' : 'transparent',\n          markBd: selected ? '#E0A434' : 'rgba(244,233,212,.35)',\n          mark: selected ? '✓' : '',\n          pick: function(){ q.type === 'multi' ? self.toggleMulti(q.id, o) : self.pickSingle(q.id, o); }\n        };\n      });\n    } else if (sStep === Q.length) {\n      sv.isEmail = true;\n    } else {\n      sv.isResults = true;\n    }\n\n    // prize\n    var qualPct = Math.round((doneCount / total) * 100) + '%';\n    var remain = total - doneCount;\n    var wallNames = this.WALL_SEED.slice();\n    if (s.claimed && s.name) wallNames = [s.name].concat(wallNames);\n    var wall = wallNames.map(function(nm, i){\n      var tilts = ['-3deg','2deg','-1.5deg','3deg','-2deg','1.5deg','-2.5deg'];\n      return { name: nm, tilt: tilts[i % tilts.length] };\n    });\n\n    // survey summary email (no backend, just a mailto)\n    var mailLines = ['Banff School secret-mission survey', '', 'Name: ' + (s.name || '(not given)'), 'Email: ' + (s.email || '(not given)'), '', 'Answers:'];\n    this.SURVEY.forEach(function(q, i){\n      var a = s.ans[q.id];\n      if (Array.isArray(a)) a = a.length ? a.join(', ') : '(no answer)';\n      mailLines.push((i + 1) + '. ' + q.q);\n      mailLines.push('   ' + (a || '(no answer)'));\n    });\n    var mailtoHref = 'mailto:hello@etcprojects.com'\n      + '?subject=' + encodeURIComponent('Banff Survey: ' + (s.name || 'New respondent'))\n      + '&body=' + encodeURIComponent(mailLines.join('\\n'));\n\n    // nav active state\n    var sc = s.screen;\n    var hubActive = (sc === 'hub' || sc === 'mission' || sc === 'land');\n    function navState(active){ return { op: active ? '1' : '.4', fg: active ? '#E0A434' : 'rgba(244,233,212,.55)' }; }\n    var nHub = navState(hubActive), nSur = navState(sc === 'survey'), nSui = navState(sc === 'suite'), nPri = navState(sc === 'prize');\n\n    return {\n      booth: booth,\n      scrollRef: this.scrollRef,\n      showChrome: s.screen !== 'land',\n      showLand: s.screen === 'land',\n      showHub: s.screen === 'hub',\n      showMission: s.screen === 'mission',\n      showSurvey: s.screen === 'survey',\n      showSuite: s.screen === 'suite',\n      showPrize: s.screen === 'prize',\n\n      countLabel: doneCount + '/' + total,\n      stamps: stamps,\n      missions: missions,\n\n      featuredKicker: featured.kicker, featuredBg: featured.bg, featuredDay: featured.day,\n      featuredKind: featured.kind, featuredTitle: featured.title, featuredTagline: featured.tagline,\n      featuredCta: featured.cta, featuredAction: featured.action,\n\n      active: active,\n      sv: sv,\n      mailtoHref: mailtoHref,\n\n      qualified: qualified, notQualified: !qualified,\n      qualPct: qualPct,\n      remainLabel: remain === 1 ? 'Just 1 mission to go.' : (remain + ' missions to go.'),\n      claimLabel: s.claimed ? '✓ ON THE WALL · YOU\\'RE ENTERED' : 'PIN ME TO THE WALL →',\n      wall: wall,\n      name: s.name, email: s.email,\n\n      nav: {\n        hubOp:nHub.op, hubFg:nHub.fg, survOp:nSur.op, survFg:nSur.fg,\n        suiteOp:nSui.op, suiteFg:nSui.fg, prizeOp:nPri.op, prizeFg:nPri.fg\n      },\n\n      goHub: function(){ self.go('hub'); },\n      goLand: function(){ self.go('land'); },\n      acceptLabel: doneCount > 0 ? 'RESUME MISSION →' : 'ACCEPT THE MISSION →',\n      goSurvey: function(){ self.go('survey'); },\n      goSuite: function(){ self.go('suite'); },\n      goPrize: function(){ self.go('prize'); },\n      sNext: function(){ self.sNext(); },\n      sBack: function(){ self.sBack(); },\n      finishSurvey: function(){ self.finishSurvey(); },\n      claim: function(){ self.claim(); },\n      onName: function(e){ self.set({ name: e.target.value }); },\n      onEmail: function(e){ self.set({ email: e.target.value, joined: !!e.target.value }); },\n      resetDemo: function(){ self.resetDemo(); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
